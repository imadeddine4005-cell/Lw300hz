name: Build lw300hz APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Prepare Android project
        run: |
          mkdir -p source
          unzip -o lw300hz_source_for_browser_build.zip -d source

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate Gradle wrapper
        working-directory: source
        run: gradle wrapper --gradle-version 8.9

      - name: Build APK
        working-directory: source
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lw300hz-debug-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
